<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Buena Vista — Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { min-height:100vh; background:#111; color:#f7f3e8; font-family:Georgia,serif; }
        .topbar { border-bottom:1px solid rgba(201,168,76,.35); padding:1.25rem 0; }
        .brand { color:#c9a84c; font-size:1.4rem; text-decoration:none; letter-spacing:.06em; }
        .brand em { color:#fff; }
        .heading { color:#c9a84c; letter-spacing:.14em; text-transform:uppercase; font-size:.8rem; }
        .contact-card { background:#191919; border:1px solid rgba(201,168,76,.28); padding:2rem; }
        .contact-card i { color:#c9a84c; font-size:1.35rem; }
        .back { color:#c9a84c; text-decoration:none; }
    </style>
</head>
<body>
    <header class="topbar"><div class="container d-flex justify-content-between align-items-center"><a class="brand" th:href="@{/principal}">Hotel <em>Buena Vista</em></a><a class="back" th:href="@{/principal}"><i class="bi bi-arrow-left"></i> Volver al inicio</a></div></header>
    <main class="container py-5">
        <p class="heading">Estamos para servirte</p>
        <h1 class="mb-4">Contacto</h1>
        <div class="row g-4">
            <div class="col-md-4"><section class="contact-card h-100"><i class="bi bi-telephone"></i><h2 class="h5 mt-3">Teléfono</h2><p class="mb-0">+506 2234-5678</p></section></div>
            <div class="col-md-4"><section class="contact-card h-100"><i class="bi bi-envelope"></i><h2 class="h5 mt-3">Correo</h2><p class="mb-0">reservas@buenavista.cr</p></section></div>
            <div class="col-md-4"><section class="contact-card h-100"><i class="bi bi-geo-alt"></i><h2 class="h5 mt-3">Ubicación</h2><p class="mb-0">Heredia, Costa Rica</p></section></div>
        </div>
    </main>
</body>
</html>
