<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Empleados</title></head><body><h1>Empleados</h1><a th:href="@{/empleados/nuevo}">Registrar empleado</a><table border="1"><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Rol</th><th>Acciones</th></tr><tr th:each="e:${empleados}"><td th:text="${e.nombre}"></td><td th:text="${e.email}"></td><td th:text="${e.telefono}"></td><td th:text="${e.rol}"></td><td><a th:href="@{/empleados/editar/{id}(id=${e.id})}">Modificar</a> <a th:href="@{/empleados/eliminar/{id}(id=${e.id})}">Eliminar</a></td></tr></table></body></html>
