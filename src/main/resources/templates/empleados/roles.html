<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Roles</title></head><body><h1>Asignar rol</h1><p th:if="${error}" th:text="${error}" style="color:red"></p><p th:if="${mensaje}" th:text="${mensaje}" style="color:green"></p><form th:action="@{/roles/asignar}" method="post"><select name="empleadoId" required><option value="">Seleccione empleado</option><option th:each="e:${empleados}" th:value="${e.id}" th:text="${e.nombre + ' - ' + e.email}"></option></select><select name="rol"><option>admin</option><option>recepcionista</option><option>supervisor</option><option>limpieza</option></select><button>Asignar</button></form></body></html>
