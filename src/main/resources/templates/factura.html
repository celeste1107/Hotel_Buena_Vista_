<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Factura</title></head><body><h1>Factura</h1><p th:if="${error}" th:text="${error}" style="color:red"></p><div th:if="${factura}"><p>Factura #<span th:text="${factura.id}"></span></p><p>Huésped: <span th:text="${factura.reserva.huesped.nombre + ' ' + factura.reserva.huesped.apellido}"></span></p><p>Habitación: <span th:text="${factura.reserva.habitacion.numero}"></span></p><p>Entrada: <span th:text="${factura.reserva.fechaEntrada}"></span></p><p>Salida: <span th:text="${factura.reserva.fechaSalida}"></span></p><p>Total: ₡<span th:text="${factura.total}"></span></p></div></body></html>
