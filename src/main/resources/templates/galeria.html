<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Buena Vista — Galería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background:#111; color:#f7f3e8; font-family:Georgia,serif; }
        .topbar { border-bottom:1px solid rgba(201,168,76,.35); padding:1.25rem 0; }
        .brand { color:#c9a84c; font-size:1.4rem; text-decoration:none; letter-spacing:.06em; }
        .brand em { color:#fff; }
        .heading { color:#c9a84c; letter-spacing:.14em; text-transform:uppercase; font-size:.8rem; }
        .gallery-image { width:100%; height:260px; object-fit:cover; border:1px solid rgba(201,168,76,.22); }
        .back { color:#c9a84c; text-decoration:none; }
    </style>
</head>
<body>
    <header class="topbar"><div class="container d-flex justify-content-between align-items-center"><a class="brand" th:href="@{/principal}">Hotel <em>Buena Vista</em></a><a class="back" th:href="@{/principal}"><i class="bi bi-arrow-left"></i> Volver al inicio</a></div></header>
    <main class="container py-5">
        <p class="heading">Hotel Buena Vista</p>
        <h1 class="mb-4">Galería</h1>
        <div class="row g-4">
            <div class="col-md-6 col-lg-4"><img class="gallery-image" src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=900&auto=format&fit=crop" alt="Vista del hotel"></div>
            <div class="col-md-6 col-lg-4"><img class="gallery-image" src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=900&auto=format&fit=crop" alt="Habitación del hotel"></div>
            <div class="col-md-6 col-lg-4"><img class="gallery-image" src="https://images.unsplash.com/photo-1584132967334-10e028bd69f7?w=900&auto=format&fit=crop" alt="Piscina del hotel"></div>
        </div>
    </main>
</body>
</html>
