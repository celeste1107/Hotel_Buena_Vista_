<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Editar huésped</title></head>
<body>
<h1>Actualizar datos del huésped</h1>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<form th:action="@{/huespedes/actualizar}" method="post" th:object="${huesped}">
    <input type="hidden" th:field="*{id}">
    <label>Nombre <input type="text" th:field="*{nombre}" required></label><br>
    <label>Apellido <input type="text" th:field="*{apellido}" required></label><br>
    <label>Email <input type="email" th:field="*{email}"></label><br>
    <label>Teléfono <input type="text" th:field="*{telefono}"></label><br>
    <label>Tipo documento <select th:field="*{tipoDocumento}"><option value="cedula">Cédula</option><option value="pasaporte">Pasaporte</option><option value="licencia">Licencia</option></select></label><br>
    <label>Documento <input type="text" th:field="*{documentoIdentidad}" required></label><br>
    <label>Nacionalidad <input type="text" th:field="*{nacionalidad}"></label><br>
    <button type="submit">Guardar cambios</button>
    <a th:href="@{/huespedes}">Cancelar</a>
</form>
</body>
</html>
