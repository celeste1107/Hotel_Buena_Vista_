<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Pago</title></head><body><h1>Pago de reserva</h1><p th:if="${error}" th:text="${error}" style="color:red"></p><p th:if="${mensaje}" th:text="${mensaje}" style="color:green"></p><div th:if="${reserva}"><p>Total: ₡<span th:text="${reserva.precioTotal}"></span></p><form th:action="@{/pagos}" method="post"><input type="hidden" name="reservaId" th:value="${reserva.id}"><select name="metodo" required><option value="sinpe">SINPE</option><option value="tarjeta">Tarjeta</option><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option></select><button>Confirmar pago</button></form></div></body></html>
