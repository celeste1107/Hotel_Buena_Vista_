<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head><meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hotel Buena Vista — Reservas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <style>:root{
            --gold:#c9a84c;
            --ink:#0b0b0b;
            --paper:#f7f3e8;
            --muted:rgba(247,243,232,.6)
        }
        body{
            min-height:100vh;
            background:radial-gradient(circle at 10% 0,#2c2618,transparent 36%),var(--ink);
            color:var(--paper);
            font-family:Georgia,serif
        }
        .bar{
            padding:1.25rem 0;
            border-bottom:1px solid rgba(201,168,76,.28)
        }
        .brand{
            color:var(--gold);
            text-decoration:none;
            font-size:1.35rem;
            letter-spacing:.07em
        }
        .brand em{
            color:var(--paper)
        }
        .back{
            color:var(--gold);
            text-decoration:none;
            font:.85rem Arial,sans-serif
        }
        .wrap{
            padding:4.6rem 12px
        }
        .eyebrow{
            color:var(--gold);
            font:700 .7rem Arial,sans-serif;
            letter-spacing:.16em;
            text-transform:uppercase
        }
        h1{
            font-size:clamp(2.4rem,6vw,4.3rem)
        }
        h1 em{
            color:var(--gold);
            font-weight:normal
        }
        .btn-gold,.action{
            border-radius:0;
            padding:.65rem .8rem;
            font:700 .66rem Arial,sans-serif;
            letter-spacing:.06em;
            text-transform:uppercase;
            text-decoration:none;
            display:inline-block
        }
        .btn-gold{
            background:var(--gold);
            border:1px solid var(--gold);
            color:#111
        }
        .table-wrap{
            border:1px solid rgba(201,168,76,.27);
            background:#181818;
            overflow-x:auto
        }
        .table{
            margin:0;
            min-width:900px;
            color:var(--paper);
            font-family:Arial,sans-serif;
            font-size:.88rem
        }
        .table thead th{
            background:#101010;
            color:var(--gold);
            border-bottom:1px solid rgba(201,168,76,.4);
            font-size:.67rem;
            letter-spacing:.1em;
            text-transform:uppercase;
            padding:1rem
        }
        .table td{
            padding:1rem;
            border-color:rgba(255,255,255,.1);
            vertical-align:middle
        }
        .table tbody tr:hover{
            background:rgba(201,168,76,.06)
        }
        .status{
            border:1px solid rgba(201,168,76,.45);
            color:var(--gold);
            padding:.27rem .5rem;
            font-size:.65rem;
            letter-spacing:.07em;
            text-transform:uppercase
        }
        .action{
            border:1px solid rgba(201,168,76,.45);
            color:var(--gold);
            margin:.12rem
        }
        .action:hover{
            background:var(--gold);
            color:#111
        }
        .success,.error{
            padding:.8rem 1rem;
            margin-bottom:1rem
        }
        .success{
            border:1px solid #5b9f76;
            color:#b9e6c8;
            background:rgba(91,159,118,.12)
        }
        .error{
            border:1px solid #a44c42;
            color:#ffb1a6;
            background:rgba(164,76,66,.12)
        }
        .empty{
            border:1px dashed rgba(201,168,76,.35);
            color:var(--muted);
            padding:2rem;
            text-align:center
        }

</style>
</head>

<body>

    <header class="bar">
        <div class="container d-flex justify-content-between align-items-center">

            <a class="brand" th:href="@{/principal}">
                Hotel <em>Buena Vista</em>
            </a>

            <a class="back" th:href="@{/principal}">
                <i class="bi bi-arrow-left"></i>
                Volver al inicio
            </a>

        </div>
    </header>

    <main class="container wrap">

        <!-- ENCABEZADO -->
        <div class="d-flex flex-column flex-md-row justify-content-between gap-3 align-items-md-end mb-4">

            <div>
                <p class="eyebrow">Gestión hotelera</p>

                <h1>
                    Reservas <em>registradas</em>
                </h1>
            </div>

            <a class="btn-gold" th:href="@{/reservas/crear}">
                <i class="bi bi-plus-lg me-1"></i>
                Crear reserva
            </a>

        </div>

        <!-- MENSAJE DE ÉXITO -->
        <p th:if="${mensaje}"
           class="success"
           th:text="${mensaje}">
        </p>

        <!-- MENSAJE DE ERROR -->
        <p th:if="${error}"
           class="error"
           th:text="${error}">
        </p>

        <!-- TABLA DE RESERVAS -->
        <div class="table-wrap"
             th:if="${not #lists.isEmpty(reservas)}">

            <table class="table">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Huésped</th>
                        <th>Habitación</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="r : ${reservas}">

                        <!-- ID -->
                        <td th:text="|#${r.id}|"></td>

                        <!-- HUÉSPED -->
                        <td th:text="${r.huesped.nombre + ' ' + r.huesped.apellido}">
                        </td>

                        <!-- HABITACIÓN -->
                        <td th:text="${r.habitacion.numero}">
                        </td>

                        <!-- ENTRADA -->
                        <td th:text="${r.fechaEntrada}">
                        </td>

                        <!-- SALIDA -->
                        <td th:text="${r.fechaSalida}">
                        </td>

                        <!-- TOTAL -->
                        <td th:text="|₡${r.precioTotal}|">
                        </td>

                        <!-- ESTADO -->
                        <td>
                            <span class="status"
                                  th:text="${r.estado}">
                            </span>
                        </td>

                        <!-- ACCIONES -->
                        <td>

                            <a class="action"
                               th:href="@{/reservas/editar/{id}(id=${r.id})}">
                                Modificar
                            </a>

                            <a class="action"
                               th:href="@{/reservas/cancelar/{id}(id=${r.id})}">
                                Cancelar
                            </a>

                            <a class="action"
                               th:href="@{/reservas/eliminar/{id}(id=${r.id})}"
                               onclick="return confirm('¿Está seguro de eliminar esta reserva?');">
                                Eliminar
                            </a>

                            <a class="action"
                               th:href="@{/pagos/{id}(id=${r.id})}">
                                Pagar
                            </a>

                            <a class="action"
                               th:href="@{/facturas/{id}(id=${r.id})}">
                                Factura
                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <!-- CUANDO NO HAY RESERVAS -->
        <section class="empty"
                 th:if="${#lists.isEmpty(reservas)}">

            <i class="bi bi-calendar-x fs-3 d-block mb-2"></i>

            Aún no hay reservas registradas.

        </section>

    </main>

</body>

</html>
