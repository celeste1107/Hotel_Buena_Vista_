<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hotel Buena Vista — Servicio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><style>:root{--gold:#c9a84c;--ink:#0b0b0b;--paper:#f7f3e8}body{min-height:100vh;background:radial-gradient(circle at 10% 0,#2c2618,transparent 34%),var(--ink);color:var(--paper);font-family:Georgia,serif}.bar{padding:1.25rem 0;border-bottom:1px solid rgba(201,168,76,.28)}.brand{color:var(--gold);text-decoration:none;font-size:1.35rem;letter-spacing:.07em}.brand em{color:var(--paper)}.back{color:var(--gold);text-decoration:none;font:.85rem Arial,sans-serif}.wrap{max-width:830px;padding:5rem 12px}.eyebrow,.form-label{color:var(--gold);font:700 .7rem Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(2.4rem,6vw,4.3rem)}h1 em{color:var(--gold);font-weight:normal}.card{background:#181818;border:1px solid rgba(201,168,76,.27);padding:2rem}.form-control{background:#101010;border:1px solid rgba(255,255,255,.2);color:var(--paper);border-radius:0;min-height:46px}.form-control:focus{background:#101010;color:var(--paper);border-color:var(--gold);box-shadow:0 0 0 .2rem rgba(201,168,76,.12)}textarea.form-control{min-height:125px}.form-check-input{background:#101010;border-color:var(--gold)}.form-check-input:checked{background-color:var(--gold);border-color:var(--gold)}.btn-gold,.btn-dark{border-radius:0;padding:.8rem 1rem;font:700 .7rem Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.btn-gold{background:var(--gold);border:1px solid var(--gold);color:#111}.btn-dark{background:transparent;border:1px solid rgba(201,168,76,.6);color:var(--gold);text-decoration:none}.alert-error{border:1px solid #a44c42;color:#ffb1a6;background:rgba(164,76,66,.12);padding:.8rem 1rem}</style></head><body><header class="bar"><div class="container d-flex justify-content-between align-items-center"><a class="brand" th:href="@{/principal}">Hotel <em>Buena Vista</em></a><a class="back" th:href="@{/servicios}"><i class="bi bi-arrow-left"></i> Servicios</a></div></header><main class="container wrap"><p class="eyebrow">Experiencias del hotel</p><h1>Administrar <em>servicio</em></h1><p th:if="${error}" class="alert-error" th:text="${error}"></p><form class="card row g-4" th:action="@{/admin/servicios/guardar}" method="post" th:object="${servicio}"><input type="hidden" th:field="*{id}"><div class="col-md-6"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" th:field="*{nombre}" required></div><div class="col-md-6"><label class="form-label" for="tipo">Tipo</label><input class="form-control" id="tipo" th:field="*{tipo}" placeholder="Ej. Spa, restaurante o tour"></div><div class="col-12"><label class="form-label" for="descripcion">Descripción</label><textarea class="form-control" id="descripcion" th:field="*{descripcion}" placeholder="Describe el servicio"></textarea></div><div class="col-md-6"><label class="form-label" for="precio">Precio</label><input class="form-control" id="precio" type="number" step="0.01" min="0" th:field="*{precio}" required></div><div class="col-md-6 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" id="disponible" type="checkbox" th:field="*{disponible}"><label class="form-check-label ms-2" for="disponible">Servicio disponible</label></div></div><div class="col-12 d-flex gap-3 mt-3"><button class="btn-gold" type="submit"><i class="bi bi-check2-circle me-1"></i> Guardar servicio</button><a class="btn-dark" th:href="@{/servicios}">Cancelar</a></div></form></main></body></html>
