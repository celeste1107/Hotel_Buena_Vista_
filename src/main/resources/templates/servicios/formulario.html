<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Servicio</title></head><body>
<h1>Administrar servicio</h1><p th:if="${error}" th:text="${error}" style="color:red"></p>
<form th:action="@{/admin/servicios/guardar}" method="post" th:object="${servicio}"><input type="hidden" th:field="*{id}">
<label>Nombre <input th:field="*{nombre}" required></label><br><label>Tipo <input th:field="*{tipo}"></label><br><label>Descripción <textarea th:field="*{descripcion}"></textarea></label><br><label>Precio <input type="number" step="0.01" th:field="*{precio}" required></label><br><label>Disponible <input type="checkbox" th:field="*{disponible}"></label><br><button>Guardar</button></form></body></html>
